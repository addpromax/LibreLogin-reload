name: "LibreLogin"
author: "MagicBIli,kyngs"
version: '${version}'
main: "xyz.kyngs.librelogin.paper.PaperBootstrap"
api-version: 1.13

softdepend:
  - Geyser-Spigot
  - floodgate
  - LuckPerms
  - FancyDialogs
  - packetevents
  - GrimAC
  - HuHoBot

permissions:
  librelogin.force-2fa:
    description: "Forces the player to set up 2FA (Two-Factor Authentication) after registration"
    default: op
  librelogin.skipmenu:
    description: "Allows player to skip CustomScreenMenu after authentication"
    default: false
