name: "LibreLogin"
author: "MagicBIli,kyngs"
version: '${version}'
main: "xyz.kyngs.librelogin.paper.PaperBootstrap"
api-version: "1.19"
folia-supported: true

dependencies:
  server:
    packetevents:
      load: "BEFORE"
      required: false
      join-classpath: true
    Geyser-Spigot:
      load: "BEFORE"
      required: false
    floodgate:
      load: "BEFORE"
      required: false
    LuckPerms:
      load: "BEFORE"
      required: false
    FancyDialogs:
      load: "BEFORE"
      required: false
      join-classpath: true

permissions:
  librelogin.force-2fa:
    description: "Forces the player to set up 2FA (Two-Factor Authentication) after registration"
    default: op